name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-guard:
    name: version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve base version
        id: base-version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_commit="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base_commit="${{ github.event.before }}"
          else
            base_commit="HEAD^"
          fi

          git show "$base_commit:version.properties" > "$RUNNER_TEMP/base-version.properties"
          echo "file=$RUNNER_TEMP/base-version.properties" >> "$GITHUB_OUTPUT"

      - name: Require a release-candidate version bump
        run: >-
          ./gradlew --no-daemon validateVersionBump
          -PbaseVersionFile=${{ steps.base-version.outputs.file }}

  verify:
    name: verify
    needs: version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c

      - name: Run canonical CI quality gates
        run: ./gradlew --no-daemon ciVerify

      - name: Upload test, lint and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-reports-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*
            build/reports/kover/**

  instrumented-smoke:
    name: instrumented-smoke
    needs: version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 30 instrumented smoke suite
        run: >-
          ./gradlew --no-daemon :app:pixel2Api30DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=com.miguelrodriguez19.safecube.MainActivitySmokeTest

      - name: Collect managed-device diagnostics
        if: failure()
        run: |
          mkdir -p app/build/ci-artifacts
          adb devices -l > app/build/ci-artifacts/adb-devices.txt || true
          device_serial="$(adb devices 2>/dev/null | awk 'NR > 1 && $2 == "device" { print $1; exit }' || true)"
          if [ -n "$device_serial" ]; then
            adb -s "$device_serial" logcat -d -v threadtime > app/build/ci-artifacts/logcat.txt || true
            adb -s "$device_serial" exec-out screencap -p > app/build/ci-artifacts/failure.png || true
          else
            printf '%s\\n' 'No managed device was available after the failed Gradle task.' > app/build/ci-artifacts/logcat.txt
            printf '%s\\n' 'No managed device was available after the failed Gradle task.' > app/build/ci-artifacts/screenshot-unavailable.txt
          fi

      - name: Upload instrumented smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: instrumented-smoke-failure-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/managedDevice/**
            app/build/reports/androidTests/managedDevice/**
            app/build/ci-artifacts/**
