name: Release Train

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-train-${{ github.sha }}
  cancel-in-progress: false

jobs:
  create-candidate-tag:
    name: create-candidate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.release-version.outputs.artifact_name }}
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      version_name: ${{ steps.release-version.outputs.version_name }}

    steps:
      - name: Check out merged source and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Android Gradle build
        uses: ./.github/actions/setup-android-gradle

      - name: Validate main release-candidate version
        id: release-version
        env:
          PUSH_BASE_COMMIT: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release candidates can only be created from main." >&2
            exit 1
          fi

          mapfile -t version_names < <(awk -F= '$1 == "VERSION_NAME" { print substr($0, index($0, "=") + 1) }' version.properties)
          if [ "${#version_names[@]}" -ne 1 ] || [ -z "${version_names[0]}" ]; then
            echo "version.properties must declare exactly one non-empty VERSION_NAME." >&2
            exit 1
          fi

          base_commit="$PUSH_BASE_COMMIT"
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ -z "$base_commit" ] || \
            [ "$base_commit" = "0000000000000000000000000000000000000000" ]; then
            base_commit="HEAD^"
          fi

          git show "$base_commit:version.properties" > "$RUNNER_TEMP/base-version.properties"
          ./gradlew --no-daemon validateVersion validateVersionBump \
            -PbaseVersionFile="$RUNNER_TEMP/base-version.properties"

          version_name="${version_names[0]}"
          printf 'artifact_name=safecube-%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'release_tag=v%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"

      - name: Create immutable candidate tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
        run: |
          existing_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$existing_ref" ]; then
            existing_type="$(jq -r '.object.type' <<< "$existing_ref")"
            existing_sha="$(jq -r '.object.sha' <<< "$existing_ref")"
            if [ "$existing_type" != "commit" ] || [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag already exists and does not point directly to this commit." >&2
              exit 1
            fi

            echo "Release tag already points to this commit; continuing the same candidate."
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" >/dev/null

  publish:
    name: publish
    needs: create-candidate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_NAME: ${{ needs.create-candidate-tag.outputs.artifact_name }}
      RELEASE_TAG: ${{ needs.create-candidate-tag.outputs.release_tag }}
      VERSION_NAME: ${{ needs.create-candidate-tag.outputs.version_name }}

    steps:
      - name: Check out exact candidate tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate identity and reject an existing release
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Candidate tag does not point to the workflow commit." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "A release already exists for this tag; assets are never overwritten." >&2
            exit 1
          fi

      - name: Set up Android Gradle build
        uses: ./.github/actions/setup-android-gradle

      - name: Validate tagged version
        run: |
          mapfile -t version_names < <(awk -F= '$1 == "VERSION_NAME" { print substr($0, index($0, "=") + 1) }' version.properties)
          if [ "${#version_names[@]}" -ne 1 ] || \
            [ "${version_names[0]}" != "$VERSION_NAME" ] || \
            [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "Tag, workflow output and VERSION_NAME must match exactly." >&2
            exit 1
          fi

          ./gradlew --no-daemon validateVersion

      - name: Decode release keystore into runner temporary storage
        env:
          SAFECUBE_RELEASE_KEYSTORE_BASE64: ${{ secrets.SAFECUBE_RELEASE_KEYSTORE_BASE64 }}
          SAFECUBE_RELEASE_STORE_PASSWORD: ${{ secrets.SAFECUBE_RELEASE_STORE_PASSWORD }}
          SAFECUBE_RELEASE_KEY_ALIAS: ${{ secrets.SAFECUBE_RELEASE_KEY_ALIAS }}
          SAFECUBE_RELEASE_KEY_PASSWORD: ${{ secrets.SAFECUBE_RELEASE_KEY_PASSWORD }}
        run: |
          for secret_name in \
            SAFECUBE_RELEASE_KEYSTORE_BASE64 \
            SAFECUBE_RELEASE_STORE_PASSWORD \
            SAFECUBE_RELEASE_KEY_ALIAS \
            SAFECUBE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Required release signing secret is unavailable: ${secret_name}." >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/safecube-release.jks"
          umask 077
          printf '%s' "$SAFECUBE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          {
            printf 'SAFECUBE_RELEASE_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'SAFECUBE_RELEASE_STORE_PASSWORD=%s\n' "$SAFECUBE_RELEASE_STORE_PASSWORD"
            printf 'SAFECUBE_RELEASE_KEY_ALIAS=%s\n' "$SAFECUBE_RELEASE_KEY_ALIAS"
            printf 'SAFECUBE_RELEASE_KEY_PASSWORD=%s\n' "$SAFECUBE_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run release verification and build signed APK
        run: >-
          ./gradlew --no-daemon
          releaseVerify
          verifyReleaseSigningConfiguration
          :app:assembleRelease

      - name: Locate the single release APK
        id: release-apk
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#release_apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK." >&2
            exit 1
          fi

          printf 'path=%s\n' "${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and create release artifacts
        env:
          RELEASE_APK: ${{ steps.release-apk.outputs.path }}
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner is not available on this runner." >&2
            exit 1
          fi

          "$apksigner_path" verify --verbose --print-certs "$RELEASE_APK"

          artifact_directory="$RUNNER_TEMP/safecube-release-artifacts"
          apk_name="safecube-${VERSION_NAME}.apk"
          mkdir -p "$artifact_directory"
          cp "$RELEASE_APK" "$artifact_directory/$apk_name"
          (
            cd "$artifact_directory"
            sha256sum "$apk_name" > "$apk_name.sha256"
            sha256sum --check "$apk_name.sha256"
          )

      - name: Upload signed APK and checksum as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/safecube-release-artifacts/safecube-${{ env.VERSION_NAME }}.apk
            ${{ runner.temp }}/safecube-release-artifacts/safecube-${{ env.VERSION_NAME }}.apk.sha256

      - name: Publish GitHub Release
        run: |
          artifact_directory="$RUNNER_TEMP/safecube-release-artifacts"
          apk_name="safecube-${VERSION_NAME}.apk"
          checksum_name="${apk_name}.sha256"
          release_notes="$(printf 'Verify the downloaded APK with:\n\n~~~sh\nsha256sum -c %s\n~~~' "$checksum_name")"
          prerelease_flag=()
          semver_without_build_metadata="${VERSION_NAME%%+*}"
          if [[ "$semver_without_build_metadata" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            "$artifact_directory/$apk_name" \
            "$artifact_directory/$checksum_name" \
            --verify-tag \
            --generate-notes \
            --notes "$release_notes" \
            "${prerelease_flag[@]}"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/safecube-release.jks"
