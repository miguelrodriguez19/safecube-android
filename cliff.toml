[changelog]
header = """
# Changelog

All notable changes to SafeCube are generated from the Git history using
[Conventional Commits](https://www.conventionalcommits.org/).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`){% if commit.breaking %} **BREAKING**{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = """
<!-- generated by git-cliff; do not edit manually -->
"""

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
topo_order = false
topo_order_commits = false
sort_commits = "oldest"
use_branch_tags = false
processing_order = [
    "commit_preprocessors",
    "split_commits",
    "conventional_commits",
    "commit_parsers",
    "link_parsers",
]

# The first matching parser wins. The final parser intentionally retains
# non-conventional history under Other instead of silently dropping it.
commit_parsers = [
    { message = '^Merge ', skip = true },
    { message = '^chore\(deps[^)]*\)', skip = true },
    { message = '^build\(deps[^)]*\)', skip = true },
    { message = '^chore\(release\)', skip = true },
    { message = '^chore\(dependabot[^)]*\)', skip = true },
    { message = '^[a-z]+(\([^)]*\))?!:', group = '<!-- 0 -->Breaking changes' },
    { body = '(?i)BREAKING CHANGE', group = '<!-- 0 -->Breaking changes' },
    { message = '^security', group = '<!-- 3 -->Security' },
    { message = '.*\(security\)', group = '<!-- 3 -->Security' },
    { body = '(?i)security', group = '<!-- 3 -->Security' },
    { message = '^feat', group = '<!-- 1 -->Features' },
    { message = '^fix', group = '<!-- 2 -->Fixes' },
    { message = '^refactor', group = '<!-- 4 -->Refactors' },
    { message = '^docs?', group = '<!-- 5 -->Documentation' },
    { message = '^test', group = '<!-- 6 -->Tests' },
    { message = '^perf', group = '<!-- 7 -->Performance' },
    { message = '^style', group = '<!-- 8 -->Maintenance' },
    { message = '^chore', group = '<!-- 8 -->Maintenance' },
    { message = '^build', group = '<!-- 8 -->Maintenance' },
    { message = '^ci', group = '<!-- 8 -->Maintenance' },
    { message = '.*', group = '<!-- 9 -->Other' },
]
