name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate (must be v<versionName>; dry-run does not create it)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-apk:
    name: build-signed-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    outputs:
      artifact_name: ${{ steps.release-version.outputs.artifact_name }}
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      version_name: ${{ steps.release-version.outputs.version_name }}
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.4

      - name: Validate release tag and version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release workflow must run from the pushed Git tag." >&2
            exit 1
          fi

          mapfile -t version_names < <(awk -F= '$1 == "VERSION_NAME" { print substr($0, index($0, "=") + 1) }' version.properties)
          if [ "${#version_names[@]}" -ne 1 ] || [ -z "${version_names[0]}" ]; then
            echo "version.properties must declare exactly one non-empty VERSION_NAME." >&2
            exit 1
          fi

          version_name="${version_names[0]}"
          if [ "$RELEASE_TAG" != "v${version_name}" ]; then
            echo "Release tag must exactly match v<versionName>." >&2
            exit 1
          fi

          ./gradlew --no-daemon validateVersion
          printf 'artifact_name=safecube-%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore into runner temporary storage
        env:
          SAFECUBE_RELEASE_KEYSTORE_BASE64: ${{ secrets.SAFECUBE_RELEASE_KEYSTORE_BASE64 }}
          SAFECUBE_RELEASE_STORE_PASSWORD: ${{ secrets.SAFECUBE_RELEASE_STORE_PASSWORD }}
          SAFECUBE_RELEASE_KEY_ALIAS: ${{ secrets.SAFECUBE_RELEASE_KEY_ALIAS }}
          SAFECUBE_RELEASE_KEY_PASSWORD: ${{ secrets.SAFECUBE_RELEASE_KEY_PASSWORD }}
        run: |
          for secret_name in \
            SAFECUBE_RELEASE_KEYSTORE_BASE64 \
            SAFECUBE_RELEASE_STORE_PASSWORD \
            SAFECUBE_RELEASE_KEY_ALIAS \
            SAFECUBE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Required release signing secret is unavailable: ${secret_name}." >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/safecube-release.jks"
          umask 077
          printf '%s' "$SAFECUBE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          {
            printf 'SAFECUBE_RELEASE_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'SAFECUBE_RELEASE_STORE_PASSWORD=%s\n' "$SAFECUBE_RELEASE_STORE_PASSWORD"
            printf 'SAFECUBE_RELEASE_KEY_ALIAS=%s\n' "$SAFECUBE_RELEASE_KEY_ALIAS"
            printf 'SAFECUBE_RELEASE_KEY_PASSWORD=%s\n' "$SAFECUBE_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run release verification and build signed APK
        run: >-
          ./gradlew --no-daemon
          releaseVerify
          verifyReleaseSigningConfiguration
          :app:assembleRelease

      - name: Locate the single release APK
        id: release-apk
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#release_apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK." >&2
            exit 1
          fi

          printf 'path=%s\n' "${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and create release artifacts
        env:
          RELEASE_APK: ${{ steps.release-apk.outputs.path }}
          VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner is not available on this runner." >&2
            exit 1
          fi

          "$apksigner_path" verify --verbose --print-certs "$RELEASE_APK"

          artifact_directory="$RUNNER_TEMP/safecube-release-artifacts"
          artifact_name="safecube-${VERSION_NAME}.apk"
          mkdir -p "$artifact_directory"
          cp "$RELEASE_APK" "$artifact_directory/$artifact_name"
          (
            cd "$artifact_directory"
            sha256sum "$artifact_name" > "$artifact_name.sha256"
          )

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safecube-${{ steps.release-version.outputs.version_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/safecube-release-artifacts/safecube-${{ steps.release-version.outputs.version_name }}.apk
            ${{ runner.temp }}/safecube-release-artifacts/safecube-${{ steps.release-version.outputs.version_name }}.apk.sha256

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/safecube-release.jks"

  publish:
    name: publish
    needs: build-signed-apk
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_NAME: ${{ needs.build-signed-apk.outputs.artifact_name }}
      RELEASE_TAG: ${{ needs.build-signed-apk.outputs.release_tag }}
      VERSION_NAME: ${{ needs.build-signed-apk.outputs.version_name }}

    steps:
      - name: Download signed release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-signed-apk.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify downloaded artifact checksum
        run: |
          artifact_directory="$RUNNER_TEMP/release-artifact"
          apk_name="safecube-${VERSION_NAME}.apk"
          checksum_name="${apk_name}.sha256"

          mapfile -t artifact_files < <(find "$artifact_directory" -maxdepth 1 -type f -print | sort)
          if [ "${#artifact_files[@]}" -ne 2 ] || \
            [ ! -f "$artifact_directory/$apk_name" ] || \
            [ ! -f "$artifact_directory/$checksum_name" ]; then
            echo "The downloaded artifact must contain exactly the expected APK and checksum." >&2
            exit 1
          fi

          (
            cd "$artifact_directory"
            sha256sum --check "$checksum_name"
          )

      - name: Reject an existing release
        run: |
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "A release already exists for this tag; assets are never overwritten." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        run: |
          artifact_directory="$RUNNER_TEMP/release-artifact"
          apk_name="safecube-${VERSION_NAME}.apk"
          checksum_name="${apk_name}.sha256"
          release_notes="$(printf 'Verify the downloaded APK with:\n\n```sh\nsha256sum -c %s\n```' "$checksum_name")"
          prerelease_flag=()
          if [[ "$VERSION_NAME" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            "$artifact_directory/$apk_name" \
            "$artifact_directory/$checksum_name" \
            --verify-tag \
            --generate-notes \
            --notes "$release_notes" \
            "${prerelease_flag[@]}"
