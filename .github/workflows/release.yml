name: Release Train

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-train-main
  cancel-in-progress: false

jobs:
  create-candidate-tag:
    name: create-candidate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.release-version.outputs.artifact_name }}
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      version_name: ${{ steps.release-version.outputs.version_name }}

    steps:
      - name: Check out merged source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Android Gradle build
        uses: ./.github/actions/setup-android-gradle

      - name: Validate main release-candidate version
        id: release-version
        env:
          PUSH_BASE_COMMIT: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release candidates can only be created from main." >&2
            exit 1
          fi

          mapfile -t version_names < <(awk -F= '$1 == "VERSION_NAME" { print substr($0, index($0, "=") + 1) }' version.properties)
          if [ "${#version_names[@]}" -ne 1 ] || [ -z "${version_names[0]}" ]; then
            echo "version.properties must declare exactly one non-empty VERSION_NAME." >&2
            exit 1
          fi

          base_commit="$PUSH_BASE_COMMIT"
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ -z "$base_commit" ] || \
            [ "$base_commit" = "0000000000000000000000000000000000000000" ]; then
            base_commit="HEAD^"
          fi

          git show "$base_commit:version.properties" > "$RUNNER_TEMP/base-version.properties"
          ./gradlew --no-daemon validateVersionBump \
            -PbaseVersionFile="$RUNNER_TEMP/base-version.properties"

          version_name="${version_names[0]}"
          printf 'artifact_name=safecube-%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'release_tag=v%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"

      - name: Create immutable candidate tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
        run: scripts/create-immutable-release-tag.sh

  publish:
    name: publish
    needs: create-candidate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_NAME: ${{ needs.create-candidate-tag.outputs.artifact_name }}
      RELEASE_TAG: ${{ needs.create-candidate-tag.outputs.release_tag }}
      VERSION_NAME: ${{ needs.create-candidate-tag.outputs.version_name }}

    steps:
      - name: Check out exact candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate identity and reject an existing release
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Candidate tag does not point to the workflow commit." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "A release already exists for this tag; assets are never overwritten." >&2
            exit 1
          fi

      # M104 keeps tag creation isolated in create-candidate-tag. This job only reads
      # the immutable tag and prepares notes for the release that already exists as a ref.
      - name: Resolve previous release tag
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_TAG}^")"
          if [ -z "$previous_tag" ] || [ "$previous_tag" = "$RELEASE_TAG" ]; then
            echo "A previous release tag is required to generate release notes." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$previous_tag" "$RELEASE_TAG"; then
            echo "Previous release tag is not an ancestor of the candidate tag." >&2
            exit 1
          fi

          printf 'PREVIOUS_RELEASE_TAG=%s\n' "$previous_tag" >> "$GITHUB_ENV"

      - name: Install pinned git-cliff
        env:
          GIT_CLIFF_VERSION: 2.13.0
          GIT_CLIFF_ASSET: git-cliff-2.13.0-x86_64-unknown-linux-gnu.tar.gz
          GIT_CLIFF_SHA256: 29d816ea0a1f73febb9e7fe34e09d837abe8c492ee7f9c20277c3e3d0c076a49
        run: |
          archive_path="$RUNNER_TEMP/$GIT_CLIFF_ASSET"
          download_url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${GIT_CLIFF_ASSET}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "$download_url" --output "$archive_path"
          printf '%s  %s\n' "$GIT_CLIFF_SHA256" "$archive_path" | sha256sum --check --strict

          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          git_cliff_binary="$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          if [ ! -x "$git_cliff_binary" ]; then
            echo "Pinned git-cliff binary was not found after extraction." >&2
            exit 1
          fi
          git_cliff_directory="$(dirname "$git_cliff_binary")"
          printf '%s\n' "$git_cliff_directory" >> "$GITHUB_PATH"
          export PATH="$git_cliff_directory:$PATH"
          git-cliff --version

      - name: Generate release notes from the tag range
        env:
          RELEASE_NOTES: ${{ runner.temp }}/safecube-release-notes.md
        run: |
          scripts/generate-changelog.sh \
            "$PREVIOUS_RELEASE_TAG" \
            "$RELEASE_TAG" \
            "$RELEASE_NOTES"
          test -s "$RELEASE_NOTES"

      - name: Set up Android Gradle build
        uses: ./.github/actions/setup-android-gradle

      - name: Validate tagged version
        run: |
          mapfile -t version_names < <(awk -F= '$1 == "VERSION_NAME" { print substr($0, index($0, "=") + 1) }' version.properties)
          if [ "${#version_names[@]}" -ne 1 ] || \
            [ "${version_names[0]}" != "$VERSION_NAME" ] || \
            [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "Tag, workflow output and VERSION_NAME must match exactly." >&2
            exit 1
          fi

      - name: Decode release keystore into runner temporary storage
        env:
          SAFECUBE_RELEASE_KEYSTORE_BASE64: ${{ secrets.SAFECUBE_RELEASE_KEYSTORE_BASE64 }}
          SAFECUBE_RELEASE_STORE_PASSWORD: ${{ secrets.SAFECUBE_RELEASE_STORE_PASSWORD }}
          SAFECUBE_RELEASE_KEY_ALIAS: ${{ secrets.SAFECUBE_RELEASE_KEY_ALIAS }}
          SAFECUBE_RELEASE_KEY_PASSWORD: ${{ secrets.SAFECUBE_RELEASE_KEY_PASSWORD }}
        run: |
          for secret_name in \
            SAFECUBE_RELEASE_KEYSTORE_BASE64 \
            SAFECUBE_RELEASE_STORE_PASSWORD \
            SAFECUBE_RELEASE_KEY_ALIAS \
            SAFECUBE_RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Required release signing secret is unavailable: ${secret_name}." >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/safecube-release.jks"
          umask 077
          printf '%s' "$SAFECUBE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"

          {
            printf 'SAFECUBE_RELEASE_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'SAFECUBE_RELEASE_STORE_PASSWORD=%s\n' "$SAFECUBE_RELEASE_STORE_PASSWORD"
            printf 'SAFECUBE_RELEASE_KEY_ALIAS=%s\n' "$SAFECUBE_RELEASE_KEY_ALIAS"
            printf 'SAFECUBE_RELEASE_KEY_PASSWORD=%s\n' "$SAFECUBE_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run release verification and build signed APK
        run: >-
          ./gradlew --no-daemon
          releaseVerify
          verifyReleaseSigningConfiguration
          :app:assembleRelease
          :app:cyclonedxDirectBom

      - name: Locate the single release APK
        id: release-apk
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#release_apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK." >&2
            exit 1
          fi

          printf 'path=%s\n' "${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature, SBOM and release artifacts
        env:
          RELEASE_APK: ${{ steps.release-apk.outputs.path }}
          RELEASE_SBOM: build/reports/cyclonedx/safecube-release.cdx.json
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner is not available on this runner." >&2
            exit 1
          fi

          "$apksigner_path" verify --verbose --print-certs "$RELEASE_APK"
          scripts/verify-release-sbom.sh "$RELEASE_SBOM" "$VERSION_NAME"

          artifact_directory="$RUNNER_TEMP/safecube-release-artifacts"
          apk_name="safecube-${VERSION_NAME}.apk"
          sbom_name="safecube-${VERSION_NAME}.cdx.json"
          mkdir -p "$artifact_directory"
          cp "$RELEASE_APK" "$artifact_directory/$apk_name"
          cp "$RELEASE_SBOM" "$artifact_directory/$sbom_name"
          (
            cd "$artifact_directory"
            sha256sum "$apk_name" > "$apk_name.sha256"
            sha256sum --check "$apk_name.sha256"
          )

      - name: Upload signed APK, checksum and SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/safecube-release-artifacts/safecube-${{ env.VERSION_NAME }}.apk
            ${{ runner.temp }}/safecube-release-artifacts/safecube-${{ env.VERSION_NAME }}.apk.sha256
            ${{ runner.temp }}/safecube-release-artifacts/safecube-${{ env.VERSION_NAME }}.cdx.json

      - name: Publish GitHub Release
        run: |
          artifact_directory="$RUNNER_TEMP/safecube-release-artifacts"
          apk_name="safecube-${VERSION_NAME}.apk"
          checksum_name="${apk_name}.sha256"
          sbom_name="safecube-${VERSION_NAME}.cdx.json"
          release_notes="$RUNNER_TEMP/safecube-release-notes.md"
          {
            printf '\n\n---\n\nVerify the downloaded APK with:\n\n~~~sh\nsha256sum -c %s\n~~~\n\n' "$checksum_name"
            printf 'When provenance is available, verify it with:\n\n~~~sh\ngh attestation verify %s -R %s\n~~~\n' "$apk_name" "$GITHUB_REPOSITORY"
          } >> "$release_notes"
          prerelease_flag=()
          semver_without_build_metadata="${VERSION_NAME%%+*}"
          if [[ "$semver_without_build_metadata" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            "$artifact_directory/$apk_name" \
            "$artifact_directory/$checksum_name" \
            "$artifact_directory/$sbom_name" \
            --verify-tag \
            --notes-file "$release_notes" \
            "${prerelease_flag[@]}"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/safecube-release.jks"

  attest:
    name: attest-provenance
    needs:
      - create-candidate-tag
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ARTIFACT_NAME: ${{ needs.create-candidate-tag.outputs.artifact_name }}
      VERSION_NAME: ${{ needs.create-candidate-tag.outputs.version_name }}

    steps:
      - name: Download exact published workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/safecube-attestation-subject

      - name: Verify downloaded release artifact
        run: |
          artifact_directory="$RUNNER_TEMP/safecube-attestation-subject"
          apk_name="safecube-${VERSION_NAME}.apk"
          checksum_name="${apk_name}.sha256"
          sbom_name="safecube-${VERSION_NAME}.cdx.json"

          mapfile -t artifact_files < <(find "$artifact_directory" -maxdepth 1 -type f -print | sort)
          if [ "${#artifact_files[@]}" -ne 3 ]; then
            echo "Expected exactly the APK, checksum and CycloneDX SBOM." >&2
            exit 1
          fi

          for expected_file in "$apk_name" "$checksum_name" "$sbom_name"; do
            if [ ! -s "$artifact_directory/$expected_file" ]; then
              echo "Expected release artifact is missing: $expected_file." >&2
              exit 1
            fi
          done

          (
            cd "$artifact_directory"
            sha256sum --check "$checksum_name"
          )

      - name: Attest exact published APK provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/safecube-attestation-subject/safecube-${{ env.VERSION_NAME }}.apk
          create-storage-record: false
