<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SafeCube pilot mockups</title>
  <style>
    @font-face { font-family: Manrope; src: url('../assets/type/manrope/Manrope-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: Manrope; src: url('../assets/type/manrope/Manrope-Bold.ttf'); font-weight: 700; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #DAE5E4; color: #171D1D; font-family: Manrope, sans-serif; }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 28px; max-width: 72ch; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(390px, 1fr)); gap: 28px; align-items: start; }
    figure { margin: 0; display: grid; justify-content: center; gap: 8px; }
    img { width: 390px; height: 844px; border-radius: 30px; box-shadow: 0 10px 28px #00202033; background: white; }
    figcaption { text-align: center; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>SafeCube pilot mockups</h1>
  <p>SCDK-M135 review sheet. All content is synthetic; these references do not implement runtime UI.</p>
  <main><figure><img src="welcome-light.svg" alt="welcome light"><figcaption>welcome-light.svg</figcaption></figure>
<figure><img src="welcome-dark.svg" alt="welcome dark"><figcaption>welcome-dark.svg</figcaption></figure>
<figure><img src="login-light.svg" alt="login light"><figcaption>login-light.svg</figcaption></figure>
<figure><img src="login-dark.svg" alt="login dark"><figcaption>login-dark.svg</figcaption></figure>
<figure><img src="unlock-light.svg" alt="unlock light"><figcaption>unlock-light.svg</figcaption></figure>
<figure><img src="unlock-dark.svg" alt="unlock dark"><figcaption>unlock-dark.svg</figcaption></figure>
<figure><img src="vault-light.svg" alt="vault light"><figcaption>vault-light.svg</figcaption></figure>
<figure><img src="vault-dark.svg" alt="vault dark"><figcaption>vault-dark.svg</figcaption></figure></main>
</body>
</html>
